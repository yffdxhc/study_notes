<div id="progress"></div>

<div id="shell">
  <aside id="sidebar" aria-label="笔记目录">
    <div class="side-head">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <div>
          <b>笔记预览</b>
          <small>__COUNT__ 篇 · __BUILT__</small>
        </div>
      </div>
      <button class="icon-btn only-mobile" id="side-close" type="button" title="收起目录" style="margin-left:auto">×</button>
    </div>
    <div class="side-search">
      <input id="filter" type="search" placeholder="筛选标题…" autocomplete="off" spellcheck="false" aria-label="筛选笔记">
      <kbd>/</kbd>
    </div>
    <nav id="tree" class="tree scroll" aria-label="文档树"></nav>
    <div class="side-foot">
      <span class="grow" title="本地离线页面">离线可用 · v__VERSION__</span>
      <button class="icon-btn" id="theme-btn" type="button" title="切换主题"></button>
    </div>
  </aside>

  <div id="resizer" title="拖动调整宽度"></div>

  <div id="content">
    <header id="topbar">
      <button class="icon-btn only-mobile" id="side-toggle" type="button" title="目录" aria-label="目录">
        <svg viewBox="0 0 24 24"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17"/></svg>
      </button>
      <nav id="crumbs" aria-label="路径"></nav>
      <div class="top-actions">
        <button class="icon-btn" id="search-btn" type="button" title="全文搜索（Ctrl+K）">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.4"/><path d="M16 16l4.4 4.4"/></svg>
        </button>
        <button class="icon-btn" id="toc-btn" type="button" title="显示/隐藏右侧目录">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h7"/></svg>
        </button>
        <button class="icon-btn" id="font-dec" type="button" title="缩小字号">A−</button>
        <button class="icon-btn" id="font-inc" type="button" title="放大字号">A+</button>
        <button class="icon-btn" id="print-btn" type="button" title="打印 / 导出 PDF">
          <svg viewBox="0 0 24 24"><path d="M7 8V3.5h10V8M7 17.5H4.5V9.5h15v8H17"/><path d="M7 13h10v7.5H7z"/></svg>
        </button>
      </div>
    </header>

    <main id="main">
      <article id="doc" hidden></article>
      <section id="home" hidden></section>
      <nav id="pager" aria-label="上一篇下一篇"></nav>
    </main>
  </div>

  <aside id="toc-panel" aria-label="本页目录">
    <div class="toc-head">本页目录</div>
    <nav id="toc"></nav>
  </aside>
</div>

<div id="overlay" hidden>
  <div class="search-panel" role="dialog" aria-label="全文搜索">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.4"/><path d="M16 16l4.4 4.4"/></svg>
      <input id="search-input" type="text" placeholder="搜索标题、路径、正文…（空格分隔多个关键词）" autocomplete="off" spellcheck="false">
      <span class="esc">Esc</span>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<div id="lightbox" hidden><img class="lb-img" alt=""></div>
