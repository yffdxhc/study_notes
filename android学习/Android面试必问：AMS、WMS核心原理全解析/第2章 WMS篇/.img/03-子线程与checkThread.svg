<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="d1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="880" height="580" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">子线程改 UI 为什么不崩：检查在链条最末端</text>
  <text x="440" y="54" text-anchor="middle" font-size="12" fill="#777">checkThread() 要能走到才算数；走不到 = 不报错，但界面也不会更新</text>

  <!-- chain -->
  <rect x="60" y="80" width="300" height="40" rx="6" fill="#e8eefc" stroke="#6b8fd6" stroke-width="1.3"/>
  <text x="76" y="105" font-size="13" fill="#1a1a1a">TextView.setText("…")</text>

  <line x1="210" y1="120" x2="210" y2="142" stroke="#666" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="60" y="144" width="300" height="40" rx="6" fill="#e8eefc" stroke="#6b8fd6" stroke-width="1.3"/>
  <text x="76" y="169" font-size="13" fill="#1a1a1a">View.invalidate()</text>

  <line x1="210" y1="184" x2="210" y2="206" stroke="#666" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="60" y="208" width="300" height="40" rx="6" fill="#e8eefc" stroke="#6b8fd6" stroke-width="1.3"/>
  <text x="76" y="233" font-size="13" fill="#1a1a1a">ViewGroup.invalidateChild(...)</text>

  <line x1="210" y1="248" x2="210" y2="270" stroke="#666" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="60" y="272" width="300" height="40" rx="6" fill="#e8eefc" stroke="#6b8fd6" stroke-width="1.3"/>
  <text x="76" y="297" font-size="13" fill="#1a1a1a">invalidateChildInParent(...)　往上层层传</text>

  <line x1="210" y1="312" x2="210" y2="334" stroke="#666" stroke-width="1.5" marker-end="url(#d1)"/>

  <rect x="60" y="336" width="300" height="48" rx="6" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="76" y="358" font-size="13" font-weight="bold" fill="#1a1a1a">ViewRootImpl.checkThread()</text>
  <text x="76" y="376" font-size="11.5" fill="#9b3b3b">主线程？不是 → 抛 CalledFromWrongThread</text>

  <!-- 需要 ViewRootImpl -->
  <rect x="392" y="300" width="130" height="120" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="457" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">前提</text>
  <text x="457" y="348" text-anchor="middle" font-size="11.5" fill="#333">ViewRootImpl</text>
  <text x="457" y="366" text-anchor="middle" font-size="11.5" fill="#333">必须已存在</text>
  <text x="457" y="392" text-anchor="middle" font-size="11" fill="#888">（即窗口已 addView）</text>
  <line x1="360" y1="360" x2="390" y2="360" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#d1)"/>

  <!-- 两种场景 -->
  <rect x="560" y="80" width="270" height="140" rx="6" fill="#f2fdf9" stroke="#4aa88a" stroke-width="1.3"/>
  <text x="576" y="102" font-size="12.5" font-weight="bold" fill="#1f6b55">场景 A：onCreate 里</text>
  <text x="576" y="124" font-size="11.5" fill="#333">ViewRootImpl 还没创建</text>
  <text x="576" y="144" font-size="11.5" fill="#333">→ 链条在中间就断了</text>
  <text x="576" y="164" font-size="11.5" fill="#333">→ checkThread 没执行</text>
  <text x="576" y="188" font-size="12" font-weight="bold" fill="#1f6b55">结果：不崩，也不显示</text>
  <text x="576" y="206" font-size="11" fill="#666">（内容存进字段，没触发重绘）</text>

  <rect x="560" y="236" width="270" height="140" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.3"/>
  <text x="576" y="258" font-size="12.5" font-weight="bold" fill="#9b3b3b">场景 B：onResume 之后</text>
  <text x="576" y="280" font-size="11.5" fill="#333">ViewRootImpl 已创建并绑定</text>
  <text x="576" y="300" font-size="11.5" fill="#333">→ 一路走到 checkThread</text>
  <text x="576" y="320" font-size="11.5" fill="#333">→ 发现不是主线程</text>
  <text x="576" y="344" font-size="12" font-weight="bold" fill="#c0392b">结果：必崩</text>

  <!-- footer -->
  <rect x="60" y="440" width="770" height="72" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="76" y="462" font-size="12.5" font-weight="bold" fill="#1a1a1a">所以"子线程不能更新 UI"更准确的说法是</text>
  <text x="76" y="482" font-size="12" fill="#333">触发 invalidate 链、并且链条能走到底部的 ViewRootImpl 时，才会检查线程。</text>
  <text x="76" y="500" font-size="12" fill="#333">沿用同一条推理，就能解释 SurfaceView 为什么能在子线程画：它走 Surface 那条路，不经这个检查。</text>

  <text x="440" y="542" text-anchor="middle" font-size="11" fill="#999">笔记：第2章 WMS篇 / 05 子线程能更新UI吗</text>
</svg>
